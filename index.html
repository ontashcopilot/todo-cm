<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Todo List</h1>
      <p class="date" id="date"></p>
    </header>

    <div class="search-area">
      <input
        type="text"
        id="search-input"
        placeholder="&#128269; Search tasks..."
        autocomplete="off"
      />
    </div>

    <div class="input-area">
      <input
        type="text"
        id="todo-input"
        placeholder="Add a new task..."
        autocomplete="off"
        maxlength="200"
      />
      <select id="priority-select">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <input type="date" id="due-date-input" />
      <button id="add-btn" aria-label="Add task">Add</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
      <button class="filter-btn" data-filter="overdue">Overdue</button>
    </div>

    <ul id="todo-list" role="list"></ul>

    <footer class="app-footer">
      <span id="item-count">0 items left</span>
      <button id="clear-completed" class="clear-btn">Clear Completed</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
